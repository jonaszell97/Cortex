# XcodeGen spec. Cortex.xcodeproj is generated from this file and not checked
# in: run `make project` after cloning or after editing this file. Source
# folders are synced folders, so adding or removing files needs no regeneration.

name: Cortex

options:
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Cortex
    DEAD_CODE_STRIPPING: YES

packages:
  CortexCore:
    path: CortexCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.10.0

targets:
  Cortex:
    type: application
    platform: macOS
    sources:
      - path: Cortex
    dependencies:
      - package: CortexCore
      - package: KeyboardShortcuts
      # cortex-mcp goes next to the app's executable (Contents/MacOS), where
      # Settings → Knowledge points MCP clients to it.
      - target: cortex-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Cortex
        PRODUCT_MODULE_NAME: Cortex
        PRODUCT_BUNDLE_IDENTIFIER: $(MAC_BUNDLE_ID_PREFIX).Cortex
        # Menu bar app: no Dock icon, no main window.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Cortex/AppIcon.icon (Icon Composer): Finder, Spotlight, Settings,
        # notifications. The menu bar keeps its SF Symbol.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Not sandboxed: needs to post ⌘V into other apps and read the
        # pasteboard freely. Hardened runtime stays on (no code injection into
        # a process that holds the clipboard history).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        # Apple Events to Finder (its selection, for quick actions).
        CODE_SIGN_ENTITLEMENTS: Config/Cortex.entitlements
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Cortex reads the files selected in Finder to run quick actions on them.
        # Services menu entry; merged into the generated Info.plist.
        INFOPLIST_FILE: Config/Cortex-Info.plist

  # The knowledge base's MCP server (docs/modules/KNOWLEDGE.md, "The MCP server").
  # Its code is the CortexMCP library of the package; `swift run --package-path
  # CortexCore cortex-mcp` runs the same main.swift without Xcode.
  cortex-mcp:
    type: tool
    platform: macOS
    sources:
      - path: CortexCore/Sources/cortex-mcp
    dependencies:
      - package: CortexCore
        product: CortexCore
      - package: CortexCore
        product: CortexMCP
    settings:
      base:
        PRODUCT_NAME: cortex-mcp
        PRODUCT_BUNDLE_IDENTIFIER: $(MAC_BUNDLE_ID_PREFIX).cortex-mcp
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # SQLCipher is a framework: the app's, in Contents/Frameworks.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SKIP_INSTALL: YES

  CortexTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CortexTests
    dependencies:
      - target: Cortex
      # Visible for `import CortexCore`, but not linked: the app hosting the
      # tests already contains it, and a second copy would clash.
      - package: CortexCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MAC_BUNDLE_ID_PREFIX).CortexTests
        GENERATE_INFOPLIST_FILE: YES
        # Hosted in the app (for @testable import Cortex); the app skips its
        # normal startup when it sees it is hosting tests.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cortex.app/Contents/MacOS/Cortex
        BUNDLE_LOADER: $(TEST_HOST)

  # The iOS companion (plans/IOS.md).
  CortexMobile:
    type: application
    platform: iOS
    sources:
      - path: CortexMobile
      # The Mac's icon (Icon Composer files work on iOS too).
      - path: Cortex/AppIcon.icon
      # The coloured project labels and the Markdown view.
      - path: Cortex/Host/Components/TintedTag.swift
      - path: Cortex/Modules/Knowledge/Views/ProjectTag.swift
      - path: Cortex/Modules/Knowledge/Views/MarkdownView.swift
    dependencies:
      - package: CortexCore
      # Capture from anywhere (plans/IOS.md, M5), in PlugIns/.
      - target: CortexShare
      - target: CortexWidgets
    settings:
      base:
        PRODUCT_NAME: Cortex
        PRODUCT_MODULE_NAME: CortexMobile
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CortexMobile
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Cortex scans the pairing code that your Mac shows in Settings → Sync.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Cortex adds your to-dos to Reminders, and updates them when you add them again.
        # App Group and Keychain group, shared with extensions later.
        CODE_SIGN_ENTITLEMENTS: Config/CortexMobile.entitlements
        # CortexAppGroup, the cortex:// URL scheme, the quick actions and the
        # background refresh; merged into the generated Info.plist.
        INFOPLIST_FILE: Config/CortexMobile-Info.plist

  # The share sheet's "Cortex": links into the reading list's outbox, text
  # and pictures into the inbox (plans/IOS.md, M5). Shares the App Group
  # with the app, never its database or Keychain items.
  CortexShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CortexShare
      # SharedContainer, also in the app and the widgets.
      - path: CortexMobile/Shared
    dependencies:
      - package: CortexCore
    settings:
      base:
        PRODUCT_NAME: CortexShare
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CortexMobile.Share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/CortexExtension.entitlements
        INFOPLIST_FILE: Config/CortexShare-Info.plist
        SKIP_INSTALL: YES

  # Widgets and the Control Center control (plans/IOS.md, M5). They read the
  # snapshot the app writes (Widgets.json); ticking off a to-do writes its
  # file.
  CortexWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CortexWidgets
      - path: CortexMobile/Shared
      # The intents the widgets and the control run, also in the app.
      - path: CortexMobile/SharedIntents
      - path: Cortex/Host/Components/TintedTag.swift
      - path: Cortex/Modules/Knowledge/Views/ProjectTag.swift
    dependencies:
      - package: CortexCore
    settings:
      base:
        PRODUCT_NAME: CortexWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CortexMobile.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/CortexExtension.entitlements
        INFOPLIST_FILE: Config/CortexWidgets-Info.plist
        SKIP_INSTALL: YES

schemes:
  Cortex:
    build:
      targets:
        Cortex: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CortexTests
    archive:
      config: Release
  CortexMobile:
    build:
      targets:
        CortexMobile: all
    run:
      config: Debug
    archive:
      config: Release
