[project]
name = "cortex-sync-server"
version = "0.1.0"
description = "Mailbox server for Cortex sync: stores end-to-end encrypted records and blobs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.151",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["I", "F", "E", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-local-folder = ["app", "tests"]
